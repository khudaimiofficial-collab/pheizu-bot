name: Pheizu Bot 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *' 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Bot
        run: timeout 5.5h npm start || true

      - name: Save WhatsApp Session
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # Force add the auth folder to ensure it's saved
          git add auth/ -f
          git commit -m "Auto-save WhatsApp Session [Skip CI]" || echo "No changes to save"
          git push origin main
